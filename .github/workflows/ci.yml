name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: ruff check spotbot tests scripts
      - run: ruff format --check spotbot tests scripts
      - run: pytest
      - name: CLI smoke test (no network)
        run: |
          spotbot --version
          rc=0; spotbot run BTCUSDT --live --budget 10 || rc=$?
          test "$rc" -eq 2  # live without explicit limits is refused before any network call
