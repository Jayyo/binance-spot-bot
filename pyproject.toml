[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "binance-spot-bot"
version = "0.1.0"
description = "Binance spot trading bot: backtests on public data, paper trading by default, live only behind explicit checks"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Jay Cho" }]
dependencies = [
    "requests>=2.31",
    "rich>=13.7",
    "matplotlib>=3.8",
    "cryptography>=42",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6.100", "ruff>=0.5"]

[project.scripts]
spotbot = "spotbot.cli:main"

[tool.setuptools.packages.find]
include = ["spotbot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501"]
